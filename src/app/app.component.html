<div class="app-layout">
  <!-- Top Navigation / Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <span class="brand-icon">🎓</span>
        <div class="brand-text">
          <h1 class="app-title">Student Management System</h1>
          <p class="app-tagline">Angular Practical Task • Services, Pipes, Directives & Lifecycle Hooks</p>
        </div>
      </div>
      <div class="header-badge">
        <span>Angular 21 • Standalone Architecture</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="main-content">
    <div class="content-container">
      <!-- TASK 5 & 6: StudentFormComponent used inside AppComponent -->
      <app-student-form (addStudent)="onAddStudent($event)"></app-student-form>

      <!-- TASK 5 & 6: StudentListComponent used inside AppComponent -->
      <app-student-list></app-student-list>
    </div>
  </main>

  <!-- Footer -->
  <footer class="app-footer">
    <p>© Student Management Application • Built with Angular</p>
  </footer>
</div>
