<div class="form-container">
  <div class="form-header">
    <div class="form-icon">📝</div>
    <div>
      <h2 class="form-title">Add New Student</h2>
      <p class="form-subtitle">Fill in details below to register a new student</p>
    </div>
  </div>

  <form #studentForm="ngForm" (ngSubmit)="onSubmit(studentForm)" novalidate>
    <div class="form-grid">
      <!-- Student Name Input -->
      <div class="form-group">
        <label for="studentName" class="form-label">
          Student Name <span class="required">*</span>
        </label>
        <input
          type="text"
          id="studentName"
          name="studentName"
          [(ngModel)]="studentName"
          #nameCtrl="ngModel"
          required
          placeholder="e.g. John Doe"
          class="form-control"
          [class.is-invalid]="nameCtrl.invalid && nameCtrl.touched"
        />
        <div class="error-msg" *ngIf="nameCtrl.invalid && nameCtrl.touched">
          Student name is required.
        </div>
      </div>

      <!-- Course Selection -->
      <div class="form-group">
        <label for="course" class="form-label">
          Course <span class="required">*</span>
        </label>
        <select
          id="course"
          name="course"
          [(ngModel)]="course"
          required
          class="form-control select-control"
        >
          <option *ngFor="let c of courses" [value]="c">{{ c }}</option>
        </select>
      </div>

      <!-- Fees Input -->
      <div class="form-group">
        <label for="fees" class="form-label">
          Tuition Fees (₹) <span class="required">*</span>
        </label>
        <input
          type="number"
          id="fees"
          name="fees"
          [(ngModel)]="fees"
          #feesCtrl="ngModel"
          required
          min="1"
          placeholder="e.g. 5000"
          class="form-control"
          [class.is-invalid]="feesCtrl.invalid && feesCtrl.touched"
        />
        <div class="error-msg" *ngIf="feesCtrl.invalid && feesCtrl.touched">
          Please enter valid tuition fees.
        </div>
      </div>

      <!-- Status Radio / Select -->
      <div class="form-group">
        <label class="form-label">Enrollment Status <span class="required">*</span></label>
        <div class="status-options">
          <label class="radio-label">
            <input
              type="radio"
              name="status"
              value="Active"
              [(ngModel)]="status"
            />
            <span class="status-indicator active-dot"></span> Active
          </label>
          <label class="radio-label">
            <input
              type="radio"
              name="status"
              value="Inactive"
              [(ngModel)]="status"
            />
            <span class="status-indicator inactive-dot"></span> Inactive
          </label>
        </div>
      </div>
    </div>

    <div class="form-actions">
      <button
        type="submit"
        class="btn-submit"
        [disabled]="studentForm.invalid"
      >
        ➕ Register Student
      </button>
    </div>
  </form>
</div>
